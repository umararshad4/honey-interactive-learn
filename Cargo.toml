[workspace]
resolver = "3"
members = ["crates/hil-core", "crates/hil-cli", "crates/hil-desktop"]
default-members = ["crates/hil-core", "crates/hil-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/umararshad4/honey-interactive-learn"
homepage = "https://github.com/umararshad4/honey-interactive-learn"
authors = ["Umar Arshad"]

[workspace.dependencies]
hil-core = { path = "crates/hil-core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
